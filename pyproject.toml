[project]
name = "resolvedesk"
version = "0.1.0"
description = "Evidence-backed support resolution with LangGraph, FastAPI, Gemini and MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.20,<2", "python-dotenv>=1,<2", "openai>=2,<3", "langsmith>=0.4,<1",
  "scikit-learn>=1.6,<2", "sentence-transformers>=5,<6", "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.12,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
